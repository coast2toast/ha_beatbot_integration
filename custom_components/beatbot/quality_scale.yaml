rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register custom actions/services.
  appropriate-polling:
    status: done
    comment: WebSocket push is primary; a 10 minute coordinator poll reconciles discovery and missed events.
  brands:
    status: done
    comment: The custom integration includes local icon and logo assets for HACS; a Home Assistant Brands submission remains necessary for Core inclusion.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: User flow, reauthentication with account-mismatch protection, duplicate account, missing/unknown region, resource API validation, and OAuth error/timeout paths are covered.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register custom actions/services.
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description:
    status: done
    comment: The HACS repository README provides the high-level integration documentation.
  docs-installation-instructions:
    status: done
    comment: Installation, OAuth setup, and supported-region instructions are documented in README.md.
  docs-removal-instructions:
    status: done
    comment: Removal instructions are documented in README.md.
  docs-triggers:
    status: exempt
    comment: This integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Entity commands raise translated Home Assistant exceptions for invalid input, offline devices, authentication failures, and connection failures.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README.md documents OAuth-derived account and region configuration and the reauthentication path.
  docs-installation-parameters:
    status: done
    comment: README.md states that there are no manual installation parameters or YAML settings.
  entity-unavailable:
    status: done
    comment: Coordinator health, per-device runtime-state freshness, and device connectivity control availability, with tests for partial responses, state-service outages, offline devices, failed updates, and removed devices.
  integration-owner:
    status: done
    comment: The manifest identifies @coast2toast as code owner and maintainer.
  log-when-unavailable:
    status: done
    comment: Coordinator failures use UpdateFailed; partial state-service outages are logged once and recovery is logged once.
  parallel-updates:
    status: done
    comment: Read-only platforms declare zero and control platforms serialize cloud commands with a limit of one.
  reauthentication-flow:
    status: done
    comment: OAuth reauthentication is implemented and tested with same-account and regional resource validation.
  test-coverage:
    status: done
    comment: Every non-empty integration module exceeds 95 percent statement coverage; CI also enforces a 96 percent aggregate floor.
