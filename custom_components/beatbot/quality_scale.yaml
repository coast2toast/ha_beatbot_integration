rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register custom actions/services.
  appropriate-polling:
    status: done
    comment: WebSocket push is primary; a 10 minute coordinator poll reconciles discovery and missed events.
  brands:
    status: done
    comment: The custom integration ships icon.png and logo.png in its local brand directory, supported for custom integrations since Home Assistant 2026.3; a Brands repository submission is needed only if contributed to Core.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: User flow, reauthentication with account-mismatch protection, duplicate account, missing/unknown region, resource API validation, and OAuth error/timeout paths are covered.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register custom actions/services.
  docs-conditions:
    status: exempt
    comment: This integration does not provide conditions.
  docs-high-level-description:
    status: done
    comment: The HACS repository README provides the high-level integration documentation.
  docs-installation-instructions:
    status: done
    comment: Installation, OAuth setup, and supported-region instructions are documented in README.md.
  docs-removal-instructions:
    status: done
    comment: Removal instructions are documented in README.md.
  docs-triggers:
    status: exempt
    comment: This integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: Entity commands raise translated Home Assistant exceptions for invalid input, offline devices, authentication failures, and connection failures.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README.md documents OAuth-derived account and region configuration and the reauthentication path.
  docs-installation-parameters:
    status: done
    comment: README.md states that there are no manual installation parameters or YAML settings.
  entity-unavailable:
    status: done
    comment: Coordinator health, per-device runtime-state freshness, and device connectivity control availability, with tests for partial responses, state-service outages, offline devices, failed updates, and removed devices.
  integration-owner:
    status: done
    comment: The manifest identifies @coast2toast as code owner and maintainer.
  log-when-unavailable:
    status: done
    comment: Coordinator failures use UpdateFailed; partial state-service outages are logged once and recovery is logged once.
  parallel-updates:
    status: done
    comment: Read-only platforms declare zero and control platforms serialize cloud commands with a limit of one.
  reauthentication-flow:
    status: done
    comment: OAuth reauthentication is implemented and tested with same-account and regional resource validation.
  test-coverage:
    status: done
    comment: Every non-empty integration module exceeds 95 percent statement coverage; CI also enforces a 96 percent aggregate floor.

  # Gold
  devices:
    status: done
    comment: Every entity supplies a device-registry identifier, manufacturer, model, name, and firmware through shared device_info.
  diagnostics:
    status: done
    comment: Config-entry diagnostics expose coordinator, event-stream, capability, firmware, and runtime state while redacting OAuth/account data and omitting device identifiers and names.
  discovery-update-info:
    status: exempt
    comment: This cloud OAuth integration has no local discovery information such as a host or address to update.
  discovery:
    status: exempt
    comment: Beatbot account devices cannot be discovered before OAuth authorization and no supported local discovery protocol is available.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: WebSocket topology events and periodic discovery schedule platform reloads when devices are added or removed.
  entity-category:
    status: done
    comment: State, battery, error, connectivity, and charging entities are categorized as diagnostic; user controls remain primary entities.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Detailed work status, online connectivity, and charging diagnostics are disabled by default; primary controls, battery, and actionable error entities remain enabled.
  entity-translations: done
  exception-translations:
    status: done
    comment: Validation, authentication, offline-device, and connection failures use translated Home Assistant exceptions in every shipped locale.
  icon-translations:
    status: done
    comment: icons.json provides semantic icons and useful state-specific icons for translation-key entities that do not rely on device-class icons.
  reconfiguration-flow:
    status: exempt
    comment: There are no user-editable config-flow settings; account and region come from OAuth and credential replacement uses reauthentication.
  repair-issues:
    status: done
    comment: Runtime failures were audited; authentication is actionable through reauthentication, while cloud outages and unsupported models are not user-fixable and must not create Repairs issues.
  stale-devices:
    status: done
    comment: Removal events detach devices immediately and polling removes a device only after three consecutive successful discovery misses.
